[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-maker-as"
version = "0.1.0"
description = "Avellaneda-Stoikov market-making system for Binance USDT-M Futures"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Market Maker Team"}
]
keywords = [
    "trading",
    "market-making",
    "avellaneda-stoikov",
    "binance",
    "high-frequency-trading"
]

dependencies = [
    # Core Async Framework
    "aiohttp>=3.9.0",
    "websockets>=12.0",

    # Data Processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",

    # Configuration & Data Validation
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Binance Integration
    "python-binance>=1.0.19",

    # Message Broker
    "nats-py>=2.6.0",

    # Cache Layer
    "redis>=5.0.0",

    # Database
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",

    # Metrics & Monitoring
    "prometheus-client>=0.19.0",

    # Logging
    "structlog>=23.1.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",

    # Code Quality
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "flake8>=6.1.0",
    "pylint>=3.0.0",

    # Development
    "ipython>=8.17.0",
    "ipdb>=0.13.0",
]

[project.urls]
Repository = "https://github.com/yourusername/market-maker-as"
Documentation = "https://github.com/yourusername/market-maker-as#readme"

[tool.setuptools]
packages = ["shared", "services", "tests", "scripts"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["shared", "services", "tests", "scripts"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = "nats.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "binance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async (handled automatically)",
]

[tool.coverage.run]
source = ["shared", "services"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pylint.messages_control]
disable = [
    "C0330",
    "C0326",
    "R0903",
    "R0913",
    "W0212",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "q", "s", "x", "t", "p"]
